Account:
  type: object
  nullable: true
  properties:
    accountId:
      type: integer
      nullable: true
      format: int64
      description: |
        <div lang="ja">
        アカウントIDです。<br>
        SET時、このフィールドは必須となります。
        </div>
        <div lang="en">
        Account ID.<br>
        This field is required in SET operation.
        </div>
    accountName:
      type: string
      nullable: true
      description: |
        <div lang="ja">
        アカウント名です。<br>
        SET時、このフィールドは省略可能となります。
        </div>
        <div lang="en">
        Account name.<br>
        This field is optional in SET operation.
        </div>
    accountStatus:
      $ref: 'AccountServiceStatus.yaml#/AccountServiceStatus'
    accountType:
      $ref: 'AccountServiceType.yaml#/AccountServiceType'
    autoTaggingEnabled:
      $ref: 'AccountServiceAutoTaggingEnabled.yaml#/AccountServiceAutoTaggingEnabled'
    deliveryStatus:
      $ref: 'AccountServiceDeliveryStatus.yaml#/AccountServiceDeliveryStatus'
    isTestAccount:
      $ref: 'AccountServiceIsTestAccount.yaml#/AccountServiceIsTestAccount'
    isCancellationPending:
      $ref: 'AccountServiceIsCancellationPending.yaml#/AccountServiceIsCancellationPending'
    startDate:
      type: string
      nullable: true
      description: |
        <div lang="ja">
        掲載開始日です。<br>
        このフィールドは、レスポンスの際に返却されますが、リクエストの際には無視されます。
        </div>
        <div lang="en">
        Start date of ad serving.<br>
        Although this field will be returned in the response, it will be ignored on input.
        </div>
    endDate:
      type: string
      nullable: true
      description: |
        <div lang="ja">
        掲載終了日です。<br>
        このフィールドは、レスポンスの際に返却されますが、リクエストの際には無視されます。
        </div>
        <div lang="en">
        End date of ad serving.<br>
        Although this field will be returned in the response, it will be ignored on input.
        </div>
    isMccAccount:
      $ref: 'AccountServiceIsMccAccount.yaml#/AccountServiceIsMccAccount'
    contactBizId:
      type: string
      nullable: true
      description: |
        <div lang="ja">アカウント管理者のビジネスIDです。<br>
        MCCアカウントの場合、このフィールドは返却されず、リクエストの際も無視されます。<br>
        テストアカウントの場合、このフィールドは更新できません。<br>
        SET時に現在設定されている連絡先ビジネスIDとは別のビジネスIDを指定する場合には、以下の条件を満たす必要があります。<br>
        1. ベースアカウントがRootMCCアカウントであること。<br>
        2. 指定する連絡先ビジネスIDが、1のRootMCCアカウントと操作対象の広告アカウントに対する操作権限を保有していること。<br>
        これらの条件を満たさない場合、エラーコード120020が返却されます。<br>
        <div lang="en">Contact business ID.<br>
        If isManagerAccount is "TRUE", this field will not be returned and will be ignored on request.<br>
        If isTestAccount is "TRUE", this field cannot be updated.<br>
        When specifying a business ID different from the currently set contact business ID in SET operation, all of the following conditions must be met.<br>
        1. The base account must be a Root MCC account.<br>
        2. The specified contact business ID must have operation permissions for both the Root MCC account in condition 1 and the target ad account.<br>
        If these conditions are not met, error code 120020 will be returned.<br>
    optimizationScore:
      type: number
      nullable: true
      format: double
      description: |
        <div lang="ja">最適化スコアです。<br>
        最適化スコアは、0.0から1.0の範囲の値を返却します。<br>
        アカウントの最適化スコアが計算不可の場合、最適化スコアは返却されません。<br>
        このフィールドは、レスポンスの際に返却されますが、リクエストの際には無視されます。</div>
        <div lang="en">Optimization score.<br>
        Optimization score returns a value ranging from 0.0 to 1.0.<br>
        If the optimization score an account has is not computable, the optimization score will not be returned.
        Although this field will be returned in the response, it will be ignored on input.</div>
  title: Account
  description: |
    <div lang="ja">Accountオブジェクトは、アカウント情報を示します。<br>
    </div>
    <div lang="en">Account objects serve account information.<br>
    </div>
